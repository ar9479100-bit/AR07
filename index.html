<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 40px 15px;
      background: #f2f5f9;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #ccc;
    }

    #status {
      margin-top: 20px;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📍 Location</h2>

  <p id="status">Getting location permission...</p>

</div>

<script>

window.onload = function () {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {

    status.innerHTML =
      "❌ This browser does not support location.";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      const map =
        "https://www.google.com/maps?q="
        + lat + "," + lon;

      status.innerHTML =
        "✅ Location available<br><br>" +

        "Latitude: " + lat + "<br>" +
        "Longitude: " + lon +

        "<br><br>" +

        "<a href='" + map +
        "' target='_blank'>" +
        "🗺️ Open Google Maps" +
        "</a>";
    },

    function(error) {

      if (error.code === 1) {

        status.innerHTML =
          "❌ Location permission was denied.";

      } else {

        status.innerHTML =
          "❌ Could not get location. Please try again.";
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );

};

</script>

</body>
</html>
