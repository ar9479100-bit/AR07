
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Location</title>
</head>

<body style="text-align:center;font-family:Arial;padding:30px">

  <h2>📍 Friend Location</h2>

  <p id="status">Checking location permission...</p>

  <div id="location"></div>

  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getDatabase,
      ref,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCB4jQxUE7RBcH4EFs0F20yfud5piS8qfQ",
      authDomain: "ar07-2c19b.firebaseapp.com",
      databaseURL: "https://ar07-2c19b-default-rtdb.firebaseio.com",
      projectId: "ar07-2c19b",
      storageBucket: "ar07-2c19b.firebasestorage.app",
      messagingSenderId: "779000469231",
      appId: "1:779000469231:web:4e6c83f81c42379cfced1a",
      measurementId: "G-TFC454RWYD"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);


    function getLocation() {

      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerHTML = "❌ Location not supported";
        return;
      }

      status.innerHTML = "📡 Getting location...";


      navigator.geolocation.getCurrentPosition(

        async function(position) {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          const map =
            "https://www.google.com/maps?q="
            + latitude + "," + longitude;


          try {

            await set(
              ref(database, "friendLocation"),
              {
                latitude: latitude,
                longitude: longitude,
                time: Date.now()
              }
            );

            document.getElementById("status").innerHTML =
              "✅ Location shared with permission";

            document.getElementById("location").innerHTML =
              "<p>Latitude: " + latitude + "</p>" +
              "<p>Longitude: " + longitude + "</p>" +
              "<a href='" + map +
              "' target='_blank'>" +
              "🗺️ Open Google Maps" +
              "</a>";

          } catch (error) {

            document.getElementById("status").innerHTML =
              "❌ Firebase error: " + error.message;

          }

        },

        function(error) {

          document.getElementById("status").innerHTML =
            "❌ Location permission was denied.";

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );
    }


    // Automatically request location permission
    window.onload = getLocation;

  </script>

</body>
</html>
