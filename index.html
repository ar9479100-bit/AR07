<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Location</title>
</head>

<body style="font-family:Arial;text-align:center;padding:40px">

<h2>📍 Share Your Location</h2>

<p id="status">Requesting location permission...</p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyCB4jQxUE7RBcH4EFs0F20yfud5piS8qfQ",
  authDomain: "ar07-2c19b.firebaseapp.com",
  databaseURL: "https://ar07-2c19b-default-rtdb.firebaseio.com",
  projectId: "ar07-2c19b",
  storageBucket: "ar07-2c19b.firebasestorage.app",
  messagingSenderId: "779000469231",
  appId: "1:779000469231:web:4e6c83f81c42379cfced1a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const token =
  new URLSearchParams(location.search).get("token");

const status =
  document.getElementById("status");


if (!token) {

  status.innerHTML =
    "❌ Invalid sharing link.";

} else {

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;


      await set(
        ref(db, "shares/" + token),
        {
          latitude: latitude,
          longitude: longitude,
          time: Date.now()
        }
      );


      status.innerHTML =
        "✅ Location shared successfully.";

    },

    function() {

      status.innerHTML =
        "❌ Location permission was denied.";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
